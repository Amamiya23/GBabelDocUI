<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - PDFTranslate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/i18n.js"></script>
</head>

<body>
  <div class="page-wrapper">
    <header class="header">
      <div class="container">
        <nav class="nav">
          <div class="logo">PDFTranslate</div>
          <ul class="nav-links"></ul>
        </nav>
      </div>
    </header>

    <div class="page-wrapper flex flex-center">
      <div class="container" style="max-width: 500px; width: 100%;">
      <div class="glass-card fade-in" style="max-width: 100%;">
        <div class="card-header text-center">
          <p class="card-subtitle" id="subtitle" data-i18n="login.welcome">欢迎回来，请登录后继续。</p>
        </div>

        <div class="card-body">
          <!-- Setup Form (shown only on first run) -->
          <form id="setupForm" style="display: none;">
            <div class="alert alert-info mb-md">
              <strong data-i18n="login.setup.info">初始设置</strong><br>
              <span data-i18n="login.setup.desc">创建管理员账户后即可开始使用。</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="setupUsername" data-i18n="login.username">Username</label>
              <input type="text" id="setupUsername" class="form-input" placeholder="" data-i18n="login.username" required
                minlength="3">
              <span class="form-help" data-i18n="login.username.min">At least 3 characters</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="setupPassword" data-i18n="login.password">Password</label>
              <input type="password" id="setupPassword" class="form-input" placeholder="" data-i18n="login.password" required
                minlength="6">
              <span class="form-help" data-i18n="login.password.min">At least 6 characters</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="setupPasswordConfirm" data-i18n="login.password.confirm">Confirm
                Password</label>
              <input type="password" id="setupPasswordConfirm" class="form-input" placeholder="" data-i18n="login.password.confirm"
                required>
            </div>

            <div id="setupError" class="form-error" style="display: none;"></div>

              <button type="submit" class="btn btn-primary btn-block btn-lg mt-md" data-i18n="login.btn.setup">
              创建管理员账户
            </button>
          </form>

          <!-- Login Form -->
          <form id="loginForm">
            <div class="form-group">
              <label class="form-label" for="username" data-i18n="login.username">Username</label>
              <input type="text" id="username" class="form-input" placeholder="" data-i18n="login.username" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="password" data-i18n="login.password">Password</label>
              <input type="password" id="password" class="form-input" placeholder="" data-i18n="login.password" required>
            </div>

            <div id="loginError" class="form-error" style="display: none;"></div>

            <button type="submit" class="btn btn-primary btn-block btn-lg mt-md" data-i18n="login.btn.login">
              登录
            </button>
          </form>
        </div>

        <div class="card-footer text-center">
          <p class="text-muted" style="font-size: var(--font-size-sm);" id="registration-link" style="display: none;">
            <a href="/register.html" class="text-primary" data-i18n="register.link.from_login">没有账户？去注册</a>
          </p>
          <form id="registerForm" style="display: none;">
            <h2 class="text-center" data-i18n="register.title">创建账户</h2>
            <p class="text-center mb-md" data-i18n="register.subtitle">注册新账户</p>
            <div class="form-group">
              <label class="form-label" for="registerUsername" data-i18n="register.username">Username</label>
              <input type="text" id="registerUsername" class="form-input" placeholder="" data-i18n="register.username" required minlength="3">
              <span class="form-help" data-i18n="register.username.min">At least 3 characters</span>
            </div>
            <div class="form-group">
              <label class="form-label" for="registerPassword" data-i18n="register.password">Password</label>
              <input type="password" id="registerPassword" class="form-input" placeholder="" data-i18n="register.password" required minlength="6">
              <span class="form-help" data-i18n="register.password.min">At least 6 characters</span>
            </div>
            <div class="form-group">
              <label class="form-label" for="registerPasswordConfirm" data-i18n="register.password.confirm">Confirm Password</label>
              <input type="password" id="registerPasswordConfirm" class="form-input" placeholder="" data-i18n="register.password.confirm" required>
            </div>
            <div id="registerError" class="form-error" style="display: none;"></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg mt-md" data-i18n="register.btn.register">注册</button>
            <p class="text-center mt-md">
              <a href="/login.html" class="text-primary" data-i18n="register.link.login">已有账户？登录</a>
            </p>
          </form>
        </div>
      </div>
    </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    // Check if already authenticated
    if (redirectIfAuthenticated()) {
      // Will redirect, no need to continue
    } else {
      // Check if setup is required
      checkSetupStatus();
    }

    async function checkSetupStatus() {
      try {
        const status = await api.checkAuthStatus();

        if (status.setup_required) {
          // Show setup form
          document.getElementById('setupForm').style.display = 'block';
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('subtitle').setAttribute('data-i18n', 'login.setup.title');
document.getElementById('subtitle').textContent = i18n.t('login.setup.title');
        } else {
          // Show login form
          document.getElementById('setupForm').style.display = 'none';
          document.getElementById('loginForm').style.display = 'block';

          // Check if registration is enabled and show/hide registration link
          try {
            const regStatus = await api.checkRegistrationStatus();
            if (regStatus.enabled) {
              document.getElementById('registration-link').style.display = 'block';
            }
          } catch (error) {
            console.error('Failed to check registration status:', error);
            // Keep registration link hidden on error
          }
        }
      } catch (error) {
        console.error('Failed to check setup status:', error);
        showError(error);
      }
    }

    // Setup form submission
    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('setupUsername').value;
      const password = document.getElementById('setupPassword').value;
      const passwordConfirm = document.getElementById('setupPasswordConfirm').value;
      const errorDiv = document.getElementById('setupError');

      // Validate passwords match
      if (password !== passwordConfirm) {
        errorDiv.textContent = i18n.t('register.error.mismatch');
        errorDiv.style.display = 'block';
        return;
      }

      errorDiv.style.display = 'none';
      showLoading(i18n.t('login.btn.setup'));

      try {
        const response = await api.setup(username, password);

        if (response.success) {
          hideLoading();
          showSuccess(i18n.t('register.success'));
          setTimeout(() => {
            window.location.href = '/upload.html';
          }, 1000);
        }
      } catch (error) {
        hideLoading();
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
      }
    });

    // Login form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');

      errorDiv.style.display = 'none';
      showLoading(i18n.t('login.btn.login'));

      try {
        const response = await api.login(username, password);

        if (response.success) {
          hideLoading();
          showSuccess(i18n.t('login.btn.login'));
          setTimeout(() => {
            window.location.href = '/upload.html';
          }, 500);
        }
      } catch (error) {
        hideLoading();
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>

</html>
