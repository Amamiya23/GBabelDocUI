<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传 - PDFTranslate</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/i18n.js"></script>
</head>

<body>
    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="container">
                <nav class="nav">
                    <div class="logo">PDFTranslate</div>
                    <ul class="nav-links">
                        <li><a href="#" class="nav-link nav-link-user" id="user-info"></a></li>
                        <li>
                            <a href="/static/upload.html" class="nav-link nav-link-icon-only active" title="上传">
                                <span class="nav-link-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 16V4"></path>
                                        <path d="M7 9l5-5 5 5"></path>
                                        <path d="M4 20h16"></path>
                                    </svg>
                                </span>
                                <span class="sr-only" data-i18n="nav.upload">Upload</span>
                            </a>
                        </li>
                        <li>
                            <a href="/static/settings.html" class="nav-link nav-link-icon-only" title="设置" data-admin-only>
                                <span class="nav-link-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="3"></circle>
                                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.33 1V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-.33-1 1.65 1.65 0 0 0-1-.6 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1-.33H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1-.33 1.65 1.65 0 0 0 .6-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .33-1V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 .33 1 1.65 1.65 0 0 0 1 .6 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c0 .39.14.76.4 1 .26.24.62.36 1 .33H21a2 2 0 0 1 0 4h-.09c-.38-.03-.74.09-1 .33-.26.24-.4.61-.4 1.34z"></path>
                                    </svg>
                                </span>
                                <span class="sr-only" data-i18n="nav.settings">Settings</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link nav-link-icon-only" id="logout-btn" title="退出登录">
                                <span class="nav-link-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                        <path d="M16 17l5-5-5-5"></path>
                                        <path d="M21 12H9"></path>
                                    </svg>
                                </span>
                                <span class="sr-only" data-i18n="nav.logout">Logout</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <div class="grid grid-2 upload-page-grid">
                    <!-- Upload Section -->
                    <div id="upload-panel-column">
                        <div class="card upload-panel" id="upload-panel-card">
                            <div class="card-header">
                                <h2 class="card-title" data-i18n="upload.title">上传 PDF</h2>
                                <p class="card-subtitle" data-i18n="upload.subtitle">上传文件或输入链接开始翻译</p>
                            </div>

                            <div class="card-body">
                                <!-- Upload Zone -->
                                <div class="upload-zone" id="upload-zone">
                                    <div class="upload-icon">📄</div>
                                    <p class="upload-text" data-i18n="upload.drag">Drag and drop your PDF here</p>
                                    <p class="upload-hint" data-i18n="upload.browse">or click to browse</p>
                                    <input type="file" id="file-input" accept=".pdf" style="display: none;">
                                </div>

                                <div class="text-center mt-md mb-md">
                                    <span class="text-muted" data-i18n="upload.or">— OR —</span>
                                </div>

                                <!-- URL Input -->
                                <div class="form-group">
<label class="form-label" data-i18n="upload.url">PDF URL</label>
<input type="url" class="form-input" id="url-input"
                                        placeholder="" data-i18n="upload.url.placeholder">
                                </div>

                                <!-- Page Selection -->
                                <div class="form-group">
                                    <label class="form-label" data-i18n="upload.pages">Pages to Translate</label>
                                    <select class="form-select" id="page-range-select">
                                        <option value="all" data-i18n="upload.pages.all">All Pages</option>
                                        <option value="first" data-i18n="upload.pages.first">First Page Only</option>
                                        <option value="first5" data-i18n="upload.pages.first5">First 5 Pages</option>
                                        <option value="custom" data-i18n="upload.pages.custom">Custom Range</option>
                                    </select>
                                </div>

                                <div class="form-group" id="custom-pages-group" style="display: none;">
<label class="form-label" data-i18n="upload.pages.custom.label">Custom Pages</label>
<input type="text" class="form-input" id="custom-pages-input"
                                        placeholder="" data-i18n="upload.pages.custom.placeholder">
<small class="form-help" data-i18n="upload.pages.custom.help">Enter page numbers or ranges separated by commas</small>
                                </div>

                                <!-- Translate Button -->
                                <button class="btn btn-primary btn-block btn-lg" id="translate-btn" disabled
                                    data-i18n="upload.btn.translate">
                                    Translate
                                </button>
                            </div>
                        </div>

                        
                    </div>

                    <!-- History Section -->
                    <div id="activity-panel-column">
                        <div class="card activity-panel" id="activity-panel-card">
                            <div class="card-body">
                                <section class="activity-status-panel" id="result-card" data-state="idle">
                                    <div class="activity-status-header">
                                        <span class="activity-status-pill" id="result-status-pill">准备就绪</span>
                                        <h3 class="card-title" id="result-card-title" data-i18n="upload.result.title">翻译结果</h3>
                                    </div>
                                    <div id="progress-section" class="result-state-section">
                                        <p class="activity-status-caption" data-i18n="upload.activity.progress.help">PDF 正在处理中。</p>
                                        <div class="progress-bar mb-md">
                                            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                                        </div>
                                        <p id="progress-text" class="text-center text-muted" data-i18n="upload.progress.init">初始化中...</p>
                                        <p id="progress-detail" class="text-center activity-helper-text"></p>
                                    </div>
                                    <div id="error-section" class="alert alert-error result-state-section">
                                        <strong id="error-title" data-i18n="upload.activity.error">翻译需要处理</strong>
                                        <p id="error-message" style="margin: 0.5rem 0 0; color: inherit;"></p>
                                        <div class="mt-md flex gap-sm">
                                            <button class="btn btn-primary btn-sm" id="retry-translation-btn" data-i18n="common.retry">
                                                重试
                                            </button>
                                            <button class="btn btn-secondary btn-sm" id="dismiss-error-btn" data-i18n="common.reset_short">
                                                重置
                                            </button>
                                        </div>
                                    </div>
                                    <div id="success-section" class="result-state-section">
                                        <div class="activity-complete-note activity-state-box">
                                            <p class="activity-complete-title" data-i18n="upload.activity.finished">翻译已完成</p>
                                            <p class="activity-helper-text" data-i18n="upload.activity.finished.help">请在下方最近记录中下载结果。</p>
                                            <div class="activity-complete-actions">
                                                <button class="btn btn-secondary btn-sm" id="view-latest-result-btn" data-i18n="upload.activity.view_latest">查看最新记录</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div id="idle-section" class="text-center text-muted activity-idle activity-state-box result-state-section">
                                        <span data-i18n="upload.activity.ready">准备就绪</span>
                                    </div>
                                </section>

                                <div class="section-divider"></div>

                                <section class="activity-history-section">
                                    <div class="activity-list-header">
                                        <div>
                                            <h3 class="card-title" data-i18n="upload.history.title">翻译历史</h3>
                                        </div>
                                    </div>
                                    <div class="activity-history-list" id="history-list">
                                        <p class="text-center text-muted" data-i18n="upload.history.empty">暂无翻译记录</p>
                                    </div>
                                </section>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="loading-text" data-i18n="common.loading">加载中...</p>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
        let currentFile = null;
        let currentTaskId = null;
        let progressInterval = null;
        let cardHeightObserver = null;

        function syncActivityPanelHeight() {
            const uploadPanel = document.getElementById('upload-panel-card');
            const activityPanel = document.getElementById('activity-panel-card');
            const activityColumn = document.getElementById('activity-panel-column');

            if (!uploadPanel || !activityPanel || !activityColumn) {
                return;
            }

            if (window.innerWidth <= 768) {
                activityColumn.style.height = '';
                activityPanel.style.height = '';
                return;
            }

            const syncedHeight = `${uploadPanel.offsetHeight}px`;
            activityColumn.style.height = syncedHeight;
            activityPanel.style.height = syncedHeight;
        }

        function initCardHeightSync() {
            const uploadPanel = document.getElementById('upload-panel-card');
            if (!uploadPanel) {
                return;
            }

            syncActivityPanelHeight();
            window.addEventListener('resize', syncActivityPanelHeight);

            if ('ResizeObserver' in window) {
                cardHeightObserver = new ResizeObserver(() => {
                    syncActivityPanelHeight();
                });
                cardHeightObserver.observe(uploadPanel);
            }
        }

        function setResultState(state, options = {}) {
            const resultTitle = document.getElementById('result-card-title');
            const resultCard = document.getElementById('result-card');
            const resultStatusPill = document.getElementById('result-status-pill');

            resultCard.dataset.state = state;

            if (state === 'progress') {
                resultTitle.textContent = i18n.t('upload.activity.progress.title');
                resultStatusPill.textContent = i18n.t('upload.activity.pill.progress');
            } else if (state === 'result') {
                resultTitle.textContent = i18n.t('upload.activity.complete.title');
                resultStatusPill.textContent = i18n.t('upload.activity.pill.complete');
            } else if (state === 'error') {
                resultTitle.textContent = i18n.t('upload.activity.error.title');
                resultStatusPill.textContent = i18n.t('upload.activity.pill.error');
                document.getElementById('error-message').textContent = options.message || '未知错误';
            } else {
                resultTitle.textContent = i18n.t('upload.result.title');
                resultStatusPill.textContent = i18n.t('upload.activity.pill.ready');
            }
        }

        function scrollToLatestHistory() {
            const latestItem = document.querySelector('.history-item.is-latest');
            if (!latestItem) {
                return;
            }

            latestItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function stopProgressPolling() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function resetTranslationState(options = {}) {
            stopProgressPolling();
            currentTaskId = null;
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('progress-text').textContent = i18n.t('upload.progress.init');
            document.getElementById('progress-detail').textContent = '';

            if (!options.keepInput) {
                currentFile = null;
                fileInput.value = '';
                document.getElementById('url-input').value = '';
                document.getElementById('translate-btn').disabled = true;
                uploadZone.querySelector('.upload-text').textContent = i18n.t('upload.drag');
                uploadZone.querySelector('.upload-hint').textContent = i18n.t('upload.browse');
            }

            setResultState('idle');
        }

        function showTranslationError(message) {
            document.getElementById('translate-btn').disabled = !currentFile
                && !document.getElementById('url-input').value.trim();
            setResultState('error', { message });
            showAlert(message, 'error');
        }

        function getDisplayFilename(item) {
            if (item.original_filename) {
                return item.original_filename;
            }

            const filename = item.filename || '';
            const strippedFilename = filename.replace(
                /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}[_-]+/i,
                ''
            );

            return strippedFilename || filename || 'Untitled';
        }

        function getHistoryStatusClass(item) {
            if (item.status === 'completed') {
                return 'history-item-completed';
            }
            if (item.status === 'failed') {
                return 'history-item-failed';
            }
            return 'history-item-pending';
        }

        // Page range selection
        document.getElementById('page-range-select').addEventListener('change', (e) => {
            const customGroup = document.getElementById('custom-pages-group');
            customGroup.style.display = e.target.value === 'custom' ? 'block' : 'none';
        });

        // Upload zone
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');

            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type === 'application/pdf') {
                handleFileSelect(files[0]);
            } else {
                showAlert('请拖入 PDF 文件', 'error');
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            currentFile = file;
            document.getElementById('translate-btn').disabled = false;
            uploadZone.querySelector('.upload-text').textContent = file.name;
            uploadZone.querySelector('.upload-hint').textContent = `${formatFileSize(file.size)}，点击可重新选择`;
        }

        // URL input
        document.getElementById('url-input').addEventListener('input', (e) => {
            const hasUrl = e.target.value.trim().length > 0;
            document.getElementById('translate-btn').disabled = !hasUrl && !currentFile;
            if (hasUrl) {
                currentFile = null;
                fileInput.value = '';
            }
        });

        // Translate button
        document.getElementById('translate-btn').addEventListener('click', async () => {
            const urlInput = document.getElementById('url-input').value.trim();
            const pageRange = document.getElementById('page-range-select').value;
            const customPages = document.getElementById('custom-pages-input').value.trim();

            try {
                showLoading();
                document.getElementById('translate-btn').disabled = true;

                let fileId;

                if (currentFile) {
                    // Upload file
                    const uploadResponse = await api.uploadFile(currentFile);
                    fileId = uploadResponse.file_id;
                } else if (urlInput) {
                    // Use URL
                    fileId = urlInput;
                } else {
                    throw new Error('请选择文件或输入链接');
                }

                // Get page selection
                let pages = null;
                if (pageRange === 'custom' && customPages) {
                    pages = customPages;
                } else if (pageRange === 'first') {
                    pages = '1';
                } else if (pageRange === 'first5') {
                    pages = '1-5';
                }

                // Start translation - send pages as object
                const translationSettings = pages ? { pages: pages } : {};
                const result = await api.startTranslation(fileId, translationSettings);
                currentTaskId = result.task_id;

                setResultState('progress');

                // Start polling for progress
                startProgressPolling();

            } catch (error) {
                showTranslationError(`翻译失败：${error.message}`);
            } finally {
                hideLoading();
            }
        });

        function startProgressPolling() {
            stopProgressPolling();

            progressInterval = setInterval(async () => {
                try {
                    const response = await api.getTranslationStatus(currentTaskId);
                    const status = response.task || response;

                    // Update progress
                    const progressFill = document.getElementById('progress-fill');
                    const progressText = document.getElementById('progress-text');
                    const progressDetail = document.getElementById('progress-detail');

                    progressFill.style.width = (status.progress || 0) + '%';
                    progressText.textContent = status.message || status.status || '处理中...';
                    progressDetail.textContent = status.detail || '';

                    // Check if complete
                    if (status.status === 'completed') {
                        stopProgressPolling();
                        showTranslationResult(status);
                    } else if (status.status === 'failed') {
                        stopProgressPolling();
                        showTranslationError(status.message || status.error || '未知错误');
                    }
                } catch (error) {
                    console.error('Error polling status:', error);
                    stopProgressPolling();
                    showTranslationError('获取翻译状态失败');
                }
            }, 2000); // Poll every 2 seconds
        }

        function showTranslationResult(status) {
            setResultState('result');
            document.getElementById('translate-btn').disabled = false;

            // Reload history
            loadHistory();
        }

        document.getElementById('view-latest-result-btn').addEventListener('click', () => {
            scrollToLatestHistory();
        });

        async function downloadFile(fileType, taskId = null) {
            const downloadTaskId = taskId || currentTaskId;
            if (!downloadTaskId) {
                console.error('No task ID for download');
                return;
            }

            try {
                const token = localStorage.getItem('auth_token');
                const response = await fetch(`/api/translate/download/${downloadTaskId}?file_type=${fileType}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Download failed');
                }

                // Get filename from Content-Disposition header or use default
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = `translated_${fileType}.pdf`;
                if (contentDisposition) {
                    const match = contentDisposition.match(/filename="?([^";\n]+)"?/);
                    if (match) {
                        filename = match[1];
                    }
                }

                // Create blob and download
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Download error:', error);
                showAlert('下载失败：' + error.message, 'error');
            }
        }

        document.getElementById('retry-translation-btn').addEventListener('click', () => {
            const hasInput = currentFile || document.getElementById('url-input').value.trim();
            setResultState('idle');
            if (hasInput) {
                document.getElementById('translate-btn').disabled = false;
                document.getElementById('translate-btn').click();
            }
        });

        document.getElementById('dismiss-error-btn').addEventListener('click', () => {
            resetTranslationState({ keepInput: true });
            document.getElementById('translate-btn').disabled = false;
        });

        // Load translation history
        async function loadHistory() {
            try {
                const response = await api.getTranslationHistory();
                const history = response.history || [];
                const historyList = document.getElementById('history-list');

                if (history.length === 0) {
                    historyList.innerHTML = `<p class="text-center text-muted">${i18n.t('upload.history.empty')}</p>`;
                    syncActivityPanelHeight();
                    return;
                }

                historyList.innerHTML = history.map(item => {
                    const originalName = getDisplayFilename(item);
                    const isLatest = item.task_id === currentTaskId;

                    return `
                    <article class="history-item ${getHistoryStatusClass(item)}${isLatest ? ' is-latest' : ''}">
                        <div class="history-status-bar"></div>
                        <div class="history-content">
                            <div class="history-main">
                                <div class="history-title-row">
                                    <div class="history-title" title="${item.filename}">${originalName}</div>
                                    ${isLatest ? `<span class="history-latest-badge">${i18n.t('upload.activity.latest')}</span>` : ''}
                                </div>
                                <div class="history-meta">${formatDate(item.created_at)}</div>
                            </div>

                            <div class="history-actions">
                                ${item.status === 'completed' && item.mono_path ?
                            `<button class="btn btn-sm btn-primary" data-action="download" data-file-type="mono" data-task-id="${item.task_id}">${i18n.t('upload.result.mono').replace('📥 ', '')}</button>` : ''}
                                ${item.status === 'completed' && item.dual_path ?
                            `<button class="btn btn-sm btn-secondary" data-action="download" data-file-type="dual" data-task-id="${item.task_id}">${i18n.t('upload.result.dual').replace('📥 ', '')}</button>` : ''}
                                <button class="btn btn-sm btn-secondary" data-action="delete-history" data-task-id="${item.task_id}" title="${i18n.t('common.delete')}">${i18n.t('common.delete')}</button>
                            </div>
                        </div>
                    </article>
                `;
                }).join('');

                if (currentTaskId) {
                    requestAnimationFrame(() => {
                        scrollToLatestHistory();
                    });
                }

                syncActivityPanelHeight();

            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        document.getElementById('history-list').addEventListener('click', async (event) => {
            const actionButton = event.target.closest('[data-action]');
            if (!actionButton) {
                return;
            }

            const action = actionButton.dataset.action;
            const taskId = actionButton.dataset.taskId;

            if (action === 'download') {
                await downloadFile(actionButton.dataset.fileType, taskId);
                return;
            }

            if (action === 'delete-history') {
                await deleteHistoryItem(taskId);
            }
        });

        async function deleteHistoryItem(taskId) {
            const confirmed = await showConfirmDialog({
                title: '删除翻译记录',
                message: i18n.t('upload.history.delete.confirm'),
                confirmText: i18n.t('common.delete'),
                cancelText: i18n.t('common.cancel'),
                confirmType: 'danger',
            });

            if (!confirmed) {
                return;
            }
            try {
                await api.deleteHistoryItem(taskId);
                showAlert(i18n.t('upload.history.delete.success'), 'success');
                await loadHistory();
            } catch (error) {
                console.error('Delete error:', error);
                showAlert(i18n.t('upload.history.delete.failed') + error.message, 'error');
            }
        }

        // Initialize
        async function init() {
            try {
                await requireAuth();
                await updateUserInfo();
                initCardHeightSync();
                await loadHistory();
                setResultState('idle');
            } catch (error) {
                console.error('Initialization error:', error);
            }
        }

        init();
    </script>
</body>
